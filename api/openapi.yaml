openapi: 3.0.3
info:
  title: ROCKS ELECTRIC API
  version: 1.0.0
  description: Complete professional REST API for ROCKS ELECTRIC (روكس للكهرباء /
    روكس الوسام) - EV charging products, electrical equipment, categories, products,
    shopping cart, checkout (COD), order tracking, customer accounts, marketing banners,
    newsletter, contact inquiries, and staff administration.
paths:
  /api/v1/admin/contact-messages/:
    get:
      operationId: v1_admin_contact_messages_list
      description: List customer contact submissions with read/unread filter
      parameters:
      - in: query
        name: is_read
        schema:
          type: boolean
        description: Filter by read status (true/false)
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Admin Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactMessageList'
          description: ''
  /api/v1/admin/contact-messages/{id}/:
    get:
      operationId: v1_admin_contact_messages_retrieve
      description: Retrieve contact message details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this رسائل التواصل.
        required: true
      tags:
      - Admin Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessage'
          description: ''
  /api/v1/admin/contact-messages/{id}/set-read/:
    patch:
      operationId: v1_admin_contact_messages_set_read_partial_update
      description: Mark customer message as read or unread
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this رسائل التواصل.
        required: true
      tags:
      - Admin Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminContactMessageStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminContactMessageStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminContactMessageStatusRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessage'
          description: ''
  /api/v1/admin/metrics/:
    get:
      operationId: v1_admin_metrics_retrieve
      description: 'Get dashboard KPIs: orders, revenue, inventory alerts, and unread
        customer messages'
      tags:
      - Admin Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardMetrics'
          description: ''
  /api/v1/admin/orders/:
    get:
      operationId: v1_admin_orders_list
      description: List all customer orders with filtering by status and search
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payment_status
        schema:
          type: string
        description: Filter by payment status (unpaid, pending, paid, refunded)
      - in: query
        name: search
        schema:
          type: string
        description: Search by order number, customer name, phone, or email
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (pending, confirmed, processing, shipped, delivered,
          cancelled)
      tags:
      - Admin Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
  /api/v1/admin/orders/{id}/:
    get:
      operationId: v1_admin_orders_retrieve
      description: Retrieve detailed order breakdown by ID
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this الطلبات.
        required: true
      tags:
      - Admin Management
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/admin/orders/{id}/update-status/:
    patch:
      operationId: v1_admin_orders_update_status_partial_update
      description: Update order fulfillment status or payment status. When transitioning
        to 'cancelled', stock is automatically restored.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this الطلبات.
        required: true
      tags:
      - Admin Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrderUpdateStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrderUpdateStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminOrderUpdateStatusRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/auth/addresses/:
    get:
      operationId: v1_auth_addresses_list
      description: List user saved delivery addresses
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Addresses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: v1_auth_addresses_create
      description: Create a new saved delivery address
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/v1/auth/addresses/{id}/:
    get:
      operationId: v1_auth_addresses_retrieve
      description: Retrieve address details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this عناوين العملاء.
        required: true
      tags:
      - Addresses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    put:
      operationId: v1_auth_addresses_update
      description: Update delivery address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this عناوين العملاء.
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: v1_auth_addresses_partial_update
      description: Partially update delivery address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this عناوين العملاء.
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: v1_auth_addresses_destroy
      description: Delete saved delivery address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this عناوين العملاء.
        required: true
      tags:
      - Addresses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/addresses/{id}/set-default/:
    post:
      operationId: v1_auth_addresses_set_default_create
      description: Set address as default delivery address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this عناوين العملاء.
        required: true
      tags:
      - Addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: v1_auth_change_password_create
      tags:
      - Authentication & Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/favorites/:
    get:
      operationId: v1_auth_favorites_list
      description: List the signed-in customer's favorite products
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Favorites
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
    post:
      operationId: v1_auth_favorites_create
      description: Save an active product to favorites
      tags:
      - Favorites
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
              required:
              - product_id
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
          description: ''
  /api/v1/auth/favorites/{id}/:
    delete:
      operationId: v1_auth_favorites_destroy
      description: Remove a favorite by product ID
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Favorites
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - Authentication & Account
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: v1_auth_me_update
      tags:
      - Authentication & Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      tags:
      - Authentication & Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      tags:
      - Authentication & Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/cart/:
    get:
      operationId: v1_cart_retrieve
      description: Retrieve current shopping cart items, subtotal, shipping, and totals
      tags:
      - Shopping Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/clear/:
    post:
      operationId: v1_cart_clear_create
      description: Empty the shopping cart completely
      tags:
      - Shopping Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/coupon/:
    post:
      operationId: v1_cart_coupon_create
      description: Apply discount coupon code to current cart
      tags:
      - Shopping Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCouponRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplyCouponRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplyCouponRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: v1_cart_coupon_destroy
      description: Remove applied coupon from cart
      tags:
      - Shopping Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/cart/items/:
    post:
      operationId: v1_cart_items_create
      description: Add a product or variant to shopping cart
      tags:
      - Shopping Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/cart/items/{item_key}/:
    patch:
      operationId: v1_cart_items_partial_update
      description: Update cart item quantity by item key (e.g. '1' or '1:2'). Set
        quantity=0 to remove.
      parameters:
      - in: path
        name: item_key
        schema:
          type: string
        required: true
      tags:
      - Shopping Cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: v1_cart_items_destroy
      description: Remove item from shopping cart by item key
      parameters:
      - in: path
        name: item_key
        schema:
          type: string
        required: true
      tags:
      - Shopping Cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/catalog/categories/:
    get:
      operationId: v1_catalog_categories_list
      description: List all active product categories
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - 'Catalog: Categories'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
  /api/v1/catalog/categories/{slug}/:
    get:
      operationId: v1_catalog_categories_retrieve
      description: Retrieve category details by slug
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          title: الرابط المختصر
        required: true
      tags:
      - 'Catalog: Categories'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/homepage/:
    get:
      operationId: v1_catalog_homepage_retrieve
      description: Homepage showcased data (hero banner and curated homepage products)
      tags:
      - 'Catalog: Products'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomepageResponse'
          description: ''
  /api/v1/catalog/products/:
    get:
      operationId: v1_catalog_products_list
      description: Search, filter, order, and paginate active products
      parameters:
      - in: query
        name: category
        schema:
